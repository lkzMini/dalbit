<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한글 0→Hero</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<header><div class="hd"><div class="logo"><i>한</i>한글 0→Hero</div>
<nav class="pill"><button data-t="learn" class="on" data-i="learn"></button><button data-t="practice" data-i="practice"></button></nav>
<div class="bar"><button class="ib" id="lang" title="Idioma / Language"></button><button class="ib" id="th" title="Tema / Theme"></button></div></div></header>
<main>
<section id="learn">
<div class="hero"><div><h2 data-i="hT"></h2><p data-i="hP"></p><button class="cta" id="go" data-i="cta"></button></div>
<div><button class="syl go" id="syl" type="button" aria-label="ㅎ + ㅏ + ㄴ = 한"><i class="s1">ㅎ</i><i class="s2">ㅏ</i><i class="s3">ㄴ</i></button><p class="mu cap">ㅎ + ㅏ + ㄴ = 한 · han<br><span data-i="tap"></span></p></div></div>
<h3 data-i="road"></h3><div id="road"></div>
<h3 data-i="alpha"></h3><div class="seg" id="seg"><button class="on" data-a="V" data-i="vow"></button><button data-a="C" data-i="con"></button></div>
<div class="grid" id="G"></div><p class="mu" data-i="keyH"></p>
<h3 data-i="tipsT"></h3><ul class="tips" id="tips"></ul>
</section>
<section id="lesson" class="card lesson" hidden tabindex="-1"></section>
<section id="practice" hidden>
<div class="seg" id="lv"></div>
<div class="card" id="stage" tabindex="0" aria-label="Práctica de escritura / Typing practice"><div class="top"><span id="cnt"></span><div class="pb"><i id="pbar"></i></div><span id="combo"></span></div>
<div id="trk"><div id="man"><b>🚶</b></div><span id="flag">🏁</span></div>
<div id="txt"></div><div id="brk"></div><div id="rom"></div><div id="tr"></div><div id="msg" role="status" aria-live="polite"></div>
<div class="bar" style="margin-top:8px"><button class="cta" id="nx" data-i="next"></button><button class="ghost" id="sp" data-i="listen"></button>
<label class="sw"><input type="checkbox" id="ckb"><span data-i="kb"></span></label><label class="sw"><input type="checkbox" id="crm"><span data-i="romL"></span></label></div></div>
<div class="stats"><div><b id="s1"></b><small data-i="cmp"></small></div><div><b id="s2"></b><small data-i="err"></small></div><div><b id="s3"></b><small data-i="acc"></small></div></div>
<div class="card" id="kbw"><div id="kb"></div><div class="lg"><span class="c" data-i="con"></span><span class="v" data-i="vow"></span></div><p class="mu" style="text-align:center;margin:8px 0 0" data-i="hint"></p></div>
</section>
</main>
<script defer src="js/data.js"></script>
<script defer src="js/engine.js"></script>
<script defer src="js/progress.js"></script>
<script defer src="js/navigation.js"></script>
<script defer src="js/app.js"></script>

</body></html>
